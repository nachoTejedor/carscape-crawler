# Crawler diario del mercado de ocasión → Supabase (esquema market).
#
# Repositorio público: GitHub Actions no tiene límite de minutos, pero cada
# trabajo dura como mucho 6 h. Por eso el rastreo va en varios trabajos en
# paralelo (AutoScout24 en dos mitades, coches.net en cuatro, Flexicar y
# Coches.com) y al final
# uno que marca las bajas del día, cuando ya han terminado todos.
#
# Secreto necesario: SUPABASE_DB_URL (Settings → Secrets and variables → Actions).
# Los registros de las ejecuciones son públicos; GitHub tapa el secreto en ellos.
name: Crawler diario

on:
  schedule:
    - cron: "17 1 * * *"   # 01:17 UTC = 02:17 (invierno) / 03:17 (verano) en Madrid
  workflow_dispatch:
    inputs:
      modo:
        description: "completo = rastreo real; probar = 3 modelos por portal, sin tocar la base"
        type: choice
        options: [completo, probar]
        default: completo

permissions:
  contents: read

# Nunca dos rastreos a la vez (por ejemplo, uno lanzado a mano y el programado)
concurrency:
  group: crawler
  cancel-in-progress: false

jobs:
  fecha:
    name: Fecha del rastreo
    runs-on: ubuntu-latest
    outputs:
      run_date: ${{ steps.f.outputs.run_date }}
    steps:
      - id: f
        run: echo "run_date=$(TZ=Europe/Madrid date +%F)" >> "$GITHUB_OUTPUT"

  rastreo:
    name: ${{ matrix.nombre }}
    needs: fecha
    runs-on: ubuntu-latest
    timeout-minutes: 355
    # coches.net puede bloquear algún día: que falle no marca el día en rojo
    continue-on-error: ${{ matrix.portal == 'cochesnet' }}
    # Autocasión y OcasionPlus no están: responden 403 / 405 a las IPs de
    # GitHub Actions (probado el 16-11-2026). Sus lectores siguen en crawler/
    # por si cambia.
    # coches.net va despacio (20-40 s por página) y en 4 partes; lo que no da
    # tiempo un día se recorre otro (cada día empieza por un modelo distinto).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nombre: "AutoScout24 (1/2)", portal: autoscout24, parte: "1/2", minutos: 330 }
          - { nombre: "AutoScout24 (2/2)", portal: autoscout24, parte: "2/2", minutos: 330 }
          - { nombre: "coches.net (1/4)", portal: cochesnet, parte: "1/4", minutos: 330 }
          - { nombre: "coches.net (2/4)", portal: cochesnet, parte: "2/4", minutos: 330 }
          - { nombre: "coches.net (3/4)", portal: cochesnet, parte: "3/4", minutos: 330 }
          - { nombre: "coches.net (4/4)", portal: cochesnet, parte: "4/4", minutos: 330 }
          - { nombre: "Flexicar", portal: flexicar, parte: "", minutos: 330 }
          - { nombre: "Coches.com", portal: cochescom, parte: "", minutos: 330 }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prod
      - name: Comprobar el secreto
        if: inputs.modo != 'probar'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Falta el secreto SUPABASE_DB_URL (Settings → Secrets and variables → Actions)"
            exit 1
          fi
      - name: Rastrear
        if: inputs.modo != 'probar'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CRAWLER_RUN_DATE: ${{ needs.fecha.outputs.run_date }}
          CRAWLER_MODEL_SLICE: ${{ matrix.parte }}
          CRAWLER_MAX_MINUTES: ${{ matrix.minutos }}
          CRAWLER_SKIP_BAJAS: "1"
        run: pnpm crawler --portal=${{ matrix.portal }}
      - name: Probar (sin base de datos)
        if: inputs.modo == 'probar'
        env:
          CRAWLER_MAX_MODELS: "3"
          CRAWLER_MODEL_SLICE: ${{ matrix.parte }}
        run: pnpm crawler --portal=${{ matrix.portal }} --probar

  bajas:
    name: Marcar bajas del día
    needs: [fecha, rastreo]
    # También si algún portal falló: marcar_bajas solo toca los segmentos
    # completos hoy y ayer, nunca los de un portal que no terminó
    if: always() && needs.fecha.result == 'success' && inputs.modo != 'probar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # solo para el commit de mantenimiento de abajo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prod
      - name: Marcar bajas
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CRAWLER_RUN_DATE: ${{ needs.fecha.outputs.run_date }}
        run: pnpm crawler --solo-bajas
      # GitHub desactiva las tareas programadas de un repositorio público sin
      # commits en 60 días. Un commit vacío cada ~45 días lo mantiene activo.
      - name: Mantener activa la programación
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Mantenimiento: mantener activa la programación del crawler"
            git push
          fi
